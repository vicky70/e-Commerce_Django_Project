{% extends 'base.html' %}
{% load static %}

{% block title %}Payment Failed{% endblock title %}

{% block content %} 

<div class="container mt-5 mb-5">
    <div class="row justify-content-center"> 
        <div class="col-md-8 col-lg-6">
            <section class="payment-status-section cyber-card text-center">
                <h2 class="payment-fail-heading">Payment Failed</h2>
                <p class="payment-status-message">There was an issue processing your payment. Please try again.</p>
                 <div class="mt-4">
                    <a href="{% url 'checkout' %}" class="btn cyber-button-outline-warning">Try Payment Again</a>
                    <a href="{% url 'home' %}" class="btn cyber-button">Back to Home</a> 
                </div>
            </section>
        </div>
    </div>
</div>

{% endblock content %}
